[workspace]
resolver = "2"
members = [
    "crates/edith",
    "crates/edith-gateway",
    "crates/edith-config",
    "crates/edith-session",
    "crates/edith-providers",
    "crates/edith-llm",
    "crates/edith-scheduler",
    "crates/edith-media",
    "crates/edith-cli",
    "crates/edith-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Stevie <steve@example.com>"]
license = "MIT"
repository = "https://github.com/stevengonsalvez/edith-rs"
description = "A self-hosted personal AI assistant gateway - Rust implementation"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Web framework
axum = { version = "0.8", features = ["ws", "tracing", "tokio"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

# WebSocket
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"
toml = "0.8"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart", "stream"] }

# Database
rusqlite = { version = "0.33", features = ["bundled", "chrono", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Configuration
config = { version = "0.15", features = ["json5", "toml"] }
dotenvy = "0.15"
directories = "6.0"

# CLI
clap = { version = "4.5", features = ["derive", "env", "color"] }
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
thiserror = "2.0"
anyhow = "1.0"
color-eyre = "0.6"

# Crypto
uuid = { version = "1.11", features = ["v4", "serde"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"

# Time
chrono = { version = "0.4", features = ["serde"] }
humantime = "2.1"

# Telegram
teloxide = { version = "0.13", features = ["macros", "ctrlc_handler"] }

# Discord
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }

# Utilities
once_cell = "1.20"
parking_lot = "0.12"
async-trait = "0.1"
futures = "0.3"
pin-project-lite = "0.2"
bytes = "1.9"
regex = "1.11"
url = "2.5"
mime = "0.3"
mime_guess = "2.0"
tempfile = "3.14"
notify = { version = "8.0", features = ["serde"] }
dirs = "5.0"
urlencoding = "2.1"

# Testing
tokio-test = "0.4"
mockall = "0.13"
wiremock = "0.6"
assert_matches = "1.5"

# Workspace members
edith = { path = "crates/edith" }
edith-gateway = { path = "crates/edith-gateway" }
edith-config = { path = "crates/edith-config" }
edith-session = { path = "crates/edith-session" }
edith-providers = { path = "crates/edith-providers" }
edith-llm = { path = "crates/edith-llm" }
edith-scheduler = { path = "crates/edith-scheduler" }
edith-media = { path = "crates/edith-media" }
edith-cli = { path = "crates/edith-cli" }

# Cron scheduling
cron = "0.15"

# Caching with TTL
moka = { version = "0.12", features = ["future"] }

# Protocol
edith-protocol = { path = "crates/edith-protocol" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
